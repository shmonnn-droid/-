<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18181b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>הכרם - יומן כלות</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet" />
  <script>
    if (window.tailwind) tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Assistant', 'system-ui', 'sans-serif'],
            display: ['"Frank Ruhl Libre"', 'serif']
          },
          boxShadow: { soft: '0 8px 24px -12px rgba(0, 0, 0, 0.18)' }
        }
      }
    };
  </script>
  <style>
    html, body { -webkit-tap-highlight-color: transparent; }
    body {
      background: #fafafa;
      min-height: 100vh;
    }
    .hair-line { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); }
    .day-free    { background: #ffffff; color: #27272a; border-color: #e4e4e7; }
    #calendarGrid .day-free::after { content: ''; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 9999px; background: #86c39b; }
    .day-pending { background: #faf6ea; color: #6b5a1f; border-color: #d9c78f; }
    .day-booked  { background: #09090b; color: #fff;    border-color: #09090b; box-shadow: 0 4px 12px -4px rgba(0,0,0,.45); }
    .day-past    { opacity: .45; }
    .modal-enter { animation: slideUp .25s ease-out; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
    .fade-in { animation: fadeIn .2s ease-out; }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
    input, textarea { font-size: 16px; } /* prevents iOS zoom */
  </style>
</head>
<body class="font-sans text-zinc-800">

  <!-- Header -->
  <header class="sticky top-0 z-20 bg-white/85 backdrop-blur border-b border-zinc-200">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="font-display text-2xl font-bold text-zinc-900 leading-tight">הכרם - יומן כלות</h1>
        <p class="text-xs text-zinc-500">ניהול תאריכים ומתעניינות לצימר</p>
      </div>
      <button id="btnToday" class="text-sm px-3 py-1.5 rounded-full border border-zinc-900 text-zinc-900 hover:bg-zinc-100 transition">היום</button>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-4 pb-24">

    <!-- Stats -->
    <section class="grid grid-cols-3 gap-2 mb-4">
      <div class="rounded-2xl bg-white shadow-soft p-3 text-center border border-zinc-200">
        <div id="statBooked" class="text-2xl font-bold text-zinc-900">0</div>
        <div class="text-xs text-zinc-500">תפוסים החודש</div>
      </div>
      <div class="rounded-2xl bg-white shadow-soft p-3 text-center border border-zinc-200">
        <div id="statPending" class="text-2xl font-bold text-[#a08a3c]">0</div>
        <div class="text-xs text-zinc-500">בטיפול החודש</div>
      </div>
      <div class="rounded-2xl bg-white shadow-soft p-3 text-center border border-zinc-200">
        <div id="statLeads" class="text-2xl font-bold text-zinc-900">0</div>
        <div class="text-xs text-zinc-500">מתעניינות פתוחות</div>
      </div>
    </section>

    <!-- Calendar card -->
    <section class="bg-white rounded-3xl shadow-soft border border-zinc-200 overflow-hidden">
      <div class="bg-zinc-900 text-white px-4 py-4 flex items-center justify-between">
        <button id="btnPrev" aria-label="החודש הקודם" class="w-10 h-10 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center text-xl transition">&#8250;</button>
        <div class="text-center">
          <div id="monthTitle" class="font-display text-2xl font-bold tracking-wide"></div>
          <div class="hair-line w-24 mx-auto mt-1 opacity-80"></div>
        </div>
        <button id="btnNext" aria-label="החודש הבא" class="w-10 h-10 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center text-xl transition">&#8249;</button>
      </div>

      <div class="grid grid-cols-7 text-center text-xs font-semibold text-zinc-900 px-2 pt-3">
        <div>א׳</div><div>ב׳</div><div>ג׳</div><div>ד׳</div><div>ה׳</div><div>ו׳</div><div>ש׳</div>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-1.5 p-2 pb-3"></div>

      <!-- Legend -->
      <div class="flex flex-wrap justify-center gap-4 text-xs py-3 border-t border-zinc-200 bg-zinc-100">
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full day-free border"></span>פנוי</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full day-pending border"></span>יש מתעניינות</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full day-booked border"></span>תפוס</span>
      </div>
    </section>

    <!-- Upcoming bookings -->
    <section class="mt-5">
      <h2 class="font-display text-lg font-bold text-zinc-900 mb-2">אירועים קרובים</h2>
      <div id="upcomingList" class="space-y-2"></div>
    </section>

    <!-- Backup -->
    <section class="mt-6 flex gap-2 justify-center text-sm">
      <button id="btnExport" class="px-4 py-2 rounded-full border border-zinc-900 text-zinc-900 hover:bg-zinc-100">ייצוא גיבוי</button>
      <label class="px-4 py-2 rounded-full border border-zinc-900 text-zinc-900 hover:bg-zinc-100 cursor-pointer">
        ייבוא גיבוי<input id="fileImport" type="file" accept="application/json" class="hidden" />
      </label>
    </section>
  </main>

  <!-- Day Modal -->
  <div id="dayModal" class="fixed inset-0 z-40 hidden">
    <div class="absolute inset-0 bg-black/40 fade-in" data-close="dayModal"></div>
    <div class="absolute inset-x-0 bottom-0 sm:inset-0 sm:flex sm:items-center sm:justify-center pointer-events-none">
      <div class="modal-enter pointer-events-auto bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl">
        <div class="px-5 pt-4 pb-3 border-b border-zinc-200">
          <div class="w-12 h-1.5 bg-zinc-200 rounded-full mx-auto mb-3 sm:hidden"></div>
          <div class="flex items-start justify-between gap-3">
            <div>
              <div id="dayModalTitle" class="font-display text-xl font-bold text-zinc-900"></div>
              <div id="dayModalStatus" class="mt-1"></div>
            </div>
            <button class="w-9 h-9 rounded-full bg-zinc-100 text-zinc-900 text-xl leading-none" data-close="dayModal" aria-label="סגירה">&times;</button>
          </div>
        </div>
        <div id="dayModalBody" class="overflow-y-auto px-5 py-4 space-y-3 flex-1"></div>
        <div id="dayModalFooter" class="px-5 pt-3 safe-bottom border-t border-zinc-200"></div>
      </div>
    </div>
  </div>

  <!-- Lead Form Modal -->
  <div id="formModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50 fade-in" data-close="formModal"></div>
    <div class="absolute inset-x-0 bottom-0 sm:inset-0 sm:flex sm:items-center sm:justify-center pointer-events-none">
      <form id="leadForm" class="modal-enter pointer-events-auto bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl max-h-[92vh] overflow-y-auto shadow-2xl px-5 pt-5 safe-bottom" novalidate>
        <div class="flex items-center justify-between mb-4">
          <h3 id="formTitle" class="font-display text-xl font-bold text-zinc-900">מתעניינת חדשה</h3>
          <button type="button" class="w-9 h-9 rounded-full bg-zinc-100 text-zinc-900 text-xl leading-none" data-close="formModal" aria-label="סגירה">&times;</button>
        </div>
        <input type="hidden" id="fLeadId" />
        <div class="grid grid-cols-2 gap-3">
          <label class="block">
            <span class="text-sm text-zinc-500">שם פרטי *</span>
            <input id="fFirst" required class="mt-1 w-full rounded-xl border border-zinc-200 bg-zinc-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-zinc-900" />
          </label>
          <label class="block">
            <span class="text-sm text-zinc-500">שם משפחה</span>
            <input id="fLast" class="mt-1 w-full rounded-xl border border-zinc-200 bg-zinc-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-zinc-900" />
          </label>
        </div>
        <label class="block mt-3">
          <span class="text-sm text-zinc-500">טלפון *</span>
          <input id="fPhone" type="tel" inputmode="tel" dir="ltr" required class="mt-1 w-full text-right rounded-xl border border-zinc-200 bg-zinc-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-zinc-900" placeholder="050-0000000" />
        </label>
        <label class="block mt-3">
          <span class="text-sm text-zinc-500">דוא״ל</span>
          <input id="fEmail" type="email" inputmode="email" dir="ltr" class="mt-1 w-full text-right rounded-xl border border-zinc-200 bg-zinc-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-zinc-900" placeholder="name@example.com" />
        </label>
        <label class="block mt-3">
          <span class="text-sm text-zinc-500">הערות</span>
          <textarea id="fNotes" rows="3" class="mt-1 w-full rounded-xl border border-zinc-200 bg-zinc-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-zinc-900" placeholder="מספר אורחות, שעת הגעה, בקשות מיוחדות..."></textarea>
        </label>
        <fieldset class="mt-4">
          <legend class="text-sm text-zinc-500 mb-2">סטטוס הזמנה</legend>
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="fStatus" value="open" class="peer sr-only" checked />
              <div class="rounded-xl border-2 border-zinc-200 px-2 py-3 text-center transition peer-checked:border-[#c9b06a] peer-checked:bg-[#faf6ea] peer-focus-visible:ring-2 peer-focus-visible:ring-zinc-900">
                <div class="text-xl leading-none">🟡</div>
                <div class="text-sm font-semibold mt-1 text-zinc-700">מתעניינת</div>
                <div class="text-[11px] text-zinc-500">בטיפול</div>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="fStatus" value="won" class="peer sr-only" />
              <div class="rounded-xl border-2 border-zinc-200 px-2 py-3 text-center transition peer-checked:border-black peer-checked:bg-zinc-900 peer-checked:[&_*]:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-zinc-900">
                <div class="text-xl leading-none">⚫</div>
                <div class="text-sm font-semibold mt-1 text-zinc-700">סגור</div>
                <div class="text-[11px] text-zinc-500">תפיסת התאריך</div>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="fStatus" value="cancelled" class="peer sr-only" />
              <div class="rounded-xl border-2 border-zinc-200 px-2 py-3 text-center transition peer-checked:border-zinc-500 peer-checked:bg-zinc-100 peer-focus-visible:ring-2 peer-focus-visible:ring-zinc-900">
                <div class="text-xl leading-none">⚪</div>
                <div class="text-sm font-semibold mt-1 text-zinc-700">מבוטל</div>
                <div class="text-[11px] text-zinc-500">הפנייה בוטלה</div>
              </div>
            </label>
          </div>
        </fieldset>
        <p id="formError" class="text-sm text-red-600 mt-2 hidden"></p>
        <div class="flex gap-2 mt-5 mb-1">
          <button type="submit" class="flex-1 py-3 rounded-2xl bg-zinc-900 text-white font-semibold shadow-soft">שמירה</button>
          <button type="button" data-close="formModal" class="px-5 py-3 rounded-2xl border border-zinc-200 text-zinc-500">ביטול</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div id="confirmModal" class="fixed inset-0 z-[60] hidden">
    <div class="absolute inset-0 bg-black/50 fade-in"></div>
    <div class="absolute inset-0 flex items-center justify-center p-6">
      <div class="modal-enter bg-white rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl">
        <div id="confirmText" class="text-zinc-700 mb-5 leading-relaxed"></div>
        <div class="flex gap-2">
          <button id="confirmYes" class="flex-1 py-3 rounded-2xl text-white font-semibold"></button>
          <button id="confirmNo" class="flex-1 py-3 rounded-2xl border border-zinc-200 text-zinc-500">ביטול</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 inset-x-0 z-[70] flex justify-center pointer-events-none hidden">
    <div id="toastInner" class="px-5 py-3 rounded-full bg-zinc-900/90 text-white text-sm shadow-lg"></div>
  </div>

<script>
(() => {
  'use strict';

  // ---------- Storage ----------
  const STORAGE_KEY = 'bridalCabinCalendar.v1';
  // Data shape: { days: { 'YYYY-MM-DD': { status: 'booked'|null, bookedLeadId, leads: [Lead] } } }
  // Lead: { id, firstName, lastName, phone, email, notes, createdAt, state: 'open'|'won'|'lost'|'cancelled' }
  let db = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if (parsed && typeof parsed.days === 'object') return parsed;
    } catch (e) { /* ignore */ }
    return { days: {} };
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
    catch (e) { toast('שגיאה בשמירה במכשיר'); }
  }

  // ---------- Helpers ----------
  const $ = (id) => document.getElementById(id);
  const HE_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const HE_DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const todayKey = () => { const t = new Date(); return keyOf(t.getFullYear(), t.getMonth(), t.getDate()); };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const fullName = (l) => `${l.firstName} ${l.lastName || ''}`.trim();
  const prettyDate = (k) => { const d = parseKey(k); return `יום ${HE_DAYS[d.getDay()]}, ${d.getDate()} ב${HE_MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
  const intlPhone = (p) => { const digits = String(p).replace(/\D/g, ''); return digits.startsWith('0') ? '972' + digits.slice(1) : digits; };

  function getDay(k) { return db.days[k] || { status: null, bookedLeadId: null, leads: [] }; }
  function ensureDay(k) { if (!db.days[k]) db.days[k] = { status: null, bookedLeadId: null, leads: [] }; return db.days[k]; }
  function cleanupDay(k) { const d = db.days[k]; if (d && !d.status && d.leads.length === 0) delete db.days[k]; }
  function openLeads(day) { return day.leads.filter(l => l.state === 'open'); }
  function dayState(k) {
    const d = getDay(k);
    if (d.status === 'booked') return 'booked';
    if (openLeads(d).length > 0) return 'pending';
    return 'free';
  }

  // ---------- State ----------
  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth();
  let activeKey = null;

  // ---------- Calendar ----------
  function renderCalendar() {
    $('monthTitle').textContent = `${HE_MONTHS[viewMonth]} ${viewYear}`;
    const grid = $('calendarGrid');
    grid.innerHTML = '';
    const firstDow = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const tKey = todayKey();
    let booked = 0, pending = 0;

    for (let i = 0; i < firstDow; i++) grid.appendChild(document.createElement('div'));

    for (let d = 1; d <= daysInMonth; d++) {
      const k = keyOf(viewYear, viewMonth, d);
      const state = dayState(k);
      const day = getDay(k);
      if (state === 'booked') booked++;
      if (state === 'pending') pending++;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `day-${state} relative aspect-square rounded-xl border flex flex-col items-center justify-center font-semibold text-base transition active:scale-95`;
      if (k < tKey) btn.classList.add('day-past');
      if (k === tKey) btn.classList.add('ring-2', 'ring-zinc-900', 'ring-offset-1');

      let badge = '';
      const openCount = openLeads(day).length;
      if (state === 'pending') badge = `<span class="absolute top-0.5 left-1 text-[10px] font-bold">${openCount}</span>`;
      if (state === 'booked') badge = `<span class="text-[9px] leading-none mt-0.5">תפוס</span>`;
      btn.innerHTML = `<span>${d}</span>${badge}`;
      btn.setAttribute('aria-label', `${d} ${HE_MONTHS[viewMonth]} - ${state === 'booked' ? 'תפוס' : state === 'pending' ? 'בטיפול' : 'פנוי'}`);
      btn.addEventListener('click', () => openDay(k));
      grid.appendChild(btn);
    }

    $('statBooked').textContent = booked;
    $('statPending').textContent = pending;
    let totalOpen = 0;
    const tk = todayKey();
    Object.entries(db.days).forEach(([k, d]) => { if (k >= tk && d.status !== 'booked') totalOpen += openLeads(d).length; });
    $('statLeads').textContent = totalOpen;
    renderUpcoming();
  }

  function renderUpcoming() {
    const tk = todayKey();
    const items = Object.entries(db.days)
      .filter(([k, d]) => k >= tk && d.status === 'booked')
      .sort(([a], [b]) => a.localeCompare(b))
      .slice(0, 6);
    const list = $('upcomingList');
    if (!items.length) {
      list.innerHTML = `<div class="text-sm text-zinc-500 text-center py-4 bg-white rounded-2xl border border-zinc-200">אין אירועים סגורים קרובים</div>`;
      return;
    }
    list.innerHTML = items.map(([k, d]) => {
      const bride = d.leads.find(l => l.id === d.bookedLeadId);
      return `<button data-key="${k}" class="w-full text-right bg-white rounded-2xl border border-zinc-200 shadow-sm px-4 py-3 flex items-center justify-between gap-3">
        <div>
          <div class="font-semibold text-zinc-800">${esc(bride ? fullName(bride) : 'כלה')}</div>
          <div class="text-xs text-zinc-500">${prettyDate(k)}</div>
        </div>
        <span class="text-xs px-2.5 py-1 rounded-full day-booked">תפוס</span>
      </button>`;
    }).join('');
    list.querySelectorAll('[data-key]').forEach(b => b.addEventListener('click', () => openDay(b.dataset.key)));
  }

  // ---------- Day modal ----------
  function openDay(k) {
    activeKey = k;
    renderDay();
    show('dayModal');
  }

  function statusChip(state) {
    const map = {
      free: ['day-free', 'פנוי לחלוטין'],
      pending: ['day-pending', 'בטיפול – יש מתעניינות'],
      booked: ['day-booked', 'תפוס – נסגר עבור כלה']
    };
    const [cls, txt] = map[state];
    return `<span class="inline-block text-xs font-semibold px-3 py-1 rounded-full border ${cls}">${txt}</span>`;
  }

  function contactLinks(l) {
    const parts = [];
    if (l.phone) {
      parts.push(`<a href="tel:${esc(l.phone)}" class="flex-1 text-center py-2 rounded-xl bg-zinc-100 text-zinc-900 text-sm">📞 חיוג</a>`);
      parts.push(`<a href="https://wa.me/${intlPhone(l.phone)}" target="_blank" rel="noopener" class="flex-1 text-center py-2 rounded-xl bg-zinc-100 text-zinc-900 text-sm">💬 וואטסאפ</a>`);
    }
    if (l.email) parts.push(`<a href="mailto:${esc(l.email)}" class="flex-1 text-center py-2 rounded-xl bg-zinc-100 text-zinc-900 text-sm">✉️ מייל</a>`);
    return parts.length ? `<div class="flex gap-2 mt-3">${parts.join('')}</div>` : '';
  }

  function leadDetails(l) {
    return `
      <div class="text-sm text-zinc-600 space-y-0.5 mt-1">
        ${l.phone ? `<div dir="ltr" class="text-right">${esc(l.phone)}</div>` : ''}
        ${l.email ? `<div dir="ltr" class="text-right break-all">${esc(l.email)}</div>` : ''}
        ${l.notes ? `<div class="mt-2 p-2 rounded-lg bg-zinc-100 text-zinc-700 whitespace-pre-wrap">${esc(l.notes)}</div>` : ''}
      </div>`;
  }

  function renderDay() {
    const k = activeKey;
    const day = getDay(k);
    const state = dayState(k);
    $('dayModalTitle').textContent = prettyDate(k);
    $('dayModalStatus').innerHTML = statusChip(state);
    const body = $('dayModalBody');
    const footer = $('dayModalFooter');

    if (state === 'booked') {
      const bride = day.leads.find(l => l.id === day.bookedLeadId);
      const others = day.leads.filter(l => l.id !== day.bookedLeadId);
      body.innerHTML = `
        <div class="rounded-2xl border-2 border-zinc-900 bg-white p-4">
          <div class="text-xs font-bold text-zinc-500 tracking-wide mb-1">👰 הכלה של התאריך</div>
          <div class="text-lg font-bold text-zinc-800">${esc(bride ? fullName(bride) : 'כלה')}</div>
          ${bride ? leadDetails(bride) + contactLinks(bride) : ''}
          ${bride ? `<button data-act="edit" data-id="${bride.id}" class="mt-3 text-sm text-zinc-900 underline">עריכת פרטים</button>` : ''}
        </div>
        ${others.length ? `
          <div class="pt-2">
            <div class="text-sm font-semibold text-zinc-500 mb-2">מתעניינות נוספות לתאריך זה (${others.length})</div>
            ${others.map(l => `
              <div class="rounded-xl border border-zinc-200 p-3 mb-2 bg-zinc-50">
                <div class="flex justify-between items-center">
                  <div class="font-semibold text-zinc-700">${esc(fullName(l))}</div>
                  <span class="text-[11px] px-2 py-0.5 rounded-full bg-zinc-200 text-zinc-600">${l.state === 'cancelled' ? 'מבוטל' : 'התאריך נתפס'}</span>
                </div>
                ${leadDetails(l)}
                ${contactLinks(l)}
              </div>`).join('')}
          </div>` : ''}
      `;
      footer.innerHTML = `<button data-act="unbook" class="w-full py-3 mb-1 rounded-2xl border-2 border-zinc-900 text-zinc-900 font-semibold">ביטול סגירה / שחרור התאריך</button>`;
    } else {
      const leads = [...openLeads(day), ...day.leads.filter(l => l.state === 'cancelled')];
      body.innerHTML = leads.length ? leads.map(l => l.state === 'cancelled' ? `
        <div class="rounded-2xl border border-zinc-200 bg-zinc-50 p-4 opacity-75">
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="text-base font-semibold text-zinc-500 line-through">${esc(fullName(l))}</div>
              <span class="inline-block mt-1 text-[11px] px-2 py-0.5 rounded-full bg-zinc-200 text-zinc-600">מבוטל</span>
            </div>
            <div class="flex gap-1 shrink-0">
              <button data-act="edit" data-id="${l.id}" class="w-8 h-8 rounded-full bg-white text-zinc-900 text-sm" aria-label="עריכה">✎</button>
              <button data-act="delete" data-id="${l.id}" class="w-8 h-8 rounded-full bg-white text-zinc-500 text-sm" aria-label="מחיקה">🗑</button>
            </div>
          </div>
          ${leadDetails(l)}
        </div>` : `
        <div class="rounded-2xl border border-zinc-200 bg-white shadow-sm p-4">
          <div class="flex items-start justify-between gap-2">
            <div class="text-lg font-bold text-zinc-800">${esc(fullName(l))}</div>
            <div class="flex gap-1 shrink-0">
              <button data-act="edit" data-id="${l.id}" class="w-8 h-8 rounded-full bg-zinc-100 text-zinc-900 text-sm" aria-label="עריכה">✎</button>
              <button data-act="delete" data-id="${l.id}" class="w-8 h-8 rounded-full bg-zinc-100 text-zinc-500 text-sm" aria-label="מחיקה">🗑</button>
            </div>
          </div>
          ${leadDetails(l)}
          ${contactLinks(l)}
          <button data-act="book" data-id="${l.id}" class="mt-3 w-full py-3 rounded-xl bg-black text-white font-semibold shadow-soft">
            💍 סגור עסקה / הפוך לתאריך תפוס
          </button>
        </div>`).join('')
        : `<div class="text-center py-8">
             <div class="text-4xl mb-2">🤍</div>
             <div class="text-zinc-600 font-semibold">התאריך פנוי לחלוטין</div>
             <div class="text-sm text-zinc-500">עדיין אין מתעניינות ליום זה</div>
           </div>`;
      footer.innerHTML = `<button data-act="add" class="w-full py-3 mb-1 rounded-2xl bg-zinc-900 text-white font-semibold shadow-soft">+ הוסף מתעניינת חדשה</button>`;
    }
  }

  function handleDayAction(e) {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    const id = btn.dataset.id;
    const day = getDay(activeKey);
    const lead = id ? day.leads.find(l => l.id === id) : null;

    if (act === 'add') openForm(null);
    else if (act === 'edit' && lead) openForm(lead);
    else if (act === 'delete' && lead) {
      confirmBox(`למחוק את <b>${esc(fullName(lead))}</b> מרשימת המתעניינות?`, 'מחיקה', 'bg-zinc-700', () => {
        const d = ensureDay(activeKey);
        d.leads = d.leads.filter(l => l.id !== id);
        cleanupDay(activeKey); save(); renderDay(); renderCalendar(); toast('המתעניינת נמחקה');
      });
    }
    else if (act === 'book' && lead) {
      const others = openLeads(day).length - 1;
      confirmBox(
        `לסגור את התאריך <b>${prettyDate(activeKey)}</b><br>עבור <b>${esc(fullName(lead))}</b>?` +
        (others > 0 ? `<div class="text-sm text-zinc-500 mt-2">${others} מתעניינות נוספות יסומנו כ״התאריך נתפס״.</div>` : ''),
        'אישור סגירה', 'bg-black',
        () => bookDay(activeKey, lead.id)
      );
    }
    else if (act === 'unbook') {
      confirmBox('לשחרר את התאריך? הכלה וכל המתעניינות יחזרו לסטטוס ״בטיפול״.', 'שחרור', 'bg-zinc-900', () => {
        unbookDay(activeKey);
        save(); renderDay(); renderCalendar(); toast('התאריך שוחרר');
      });
    }
  }

  // Cancelled leads keep their state through booking and release.
  function unbookDay(k) {
    const d = ensureDay(k);
    d.status = null; d.bookedLeadId = null;
    d.leads.forEach(l => { if (l.state !== 'cancelled') l.state = 'open'; });
  }

  function markBooked(k, leadId) {
    const d = ensureDay(k);
    d.status = 'booked';
    d.bookedLeadId = leadId;
    d.leads.forEach(l => {
      if (l.id === leadId) l.state = 'won';
      else if (l.state !== 'cancelled') l.state = 'lost';
    });
  }

  function bookDay(k, leadId) {
    markBooked(k, leadId);
    save(); renderDay(); renderCalendar();
    toast('💍 מזל טוב! התאריך נסגר');
  }

  // ---------- Lead form ----------
  function openForm(lead) {
    $('formTitle').textContent = lead ? 'עריכת פרטי מתעניינת' : 'מתעניינת חדשה';
    $('fLeadId').value = lead ? lead.id : '';
    $('fFirst').value = lead ? lead.firstName : '';
    $('fLast').value = lead ? (lead.lastName || '') : '';
    $('fPhone').value = lead ? (lead.phone || '') : '';
    $('fEmail').value = lead ? (lead.email || '') : '';
    $('fNotes').value = lead ? (lead.notes || '') : '';
    const status = !lead ? 'open' : lead.state === 'won' ? 'won' : lead.state === 'cancelled' ? 'cancelled' : 'open';
    document.querySelector(`input[name="fStatus"][value="${status}"]`).checked = true;
    $('formError').classList.add('hidden');
    show('formModal');
    setTimeout(() => $('fFirst').focus(), 250);
  }

  function submitForm(e) {
    e.preventDefault();
    const first = $('fFirst').value.trim();
    const last = $('fLast').value.trim();
    const phone = $('fPhone').value.trim();
    const email = $('fEmail').value.trim();
    const notes = $('fNotes').value.trim();
    const err = $('formError');

    let msg = '';
    if (!first) msg = 'יש להזין שם פרטי';
    else if (!phone) msg = 'יש להזין מספר טלפון';
    else if (phone.replace(/\D/g, '').length < 9) msg = 'מספר הטלפון אינו תקין';
    else if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) msg = 'כתובת הדוא״ל אינה תקינה';
    const status = document.querySelector('input[name="fStatus"]:checked').value;
    const d = ensureDay(activeKey);
    const id = $('fLeadId').value;
    if (!msg && status === 'won' && d.status === 'booked' && d.bookedLeadId !== id) {
      const bride = d.leads.find(l => l.id === d.bookedLeadId);
      msg = `התאריך כבר תפוס עבור ${bride ? fullName(bride) : 'כלה אחרת'}`;
    }
    if (msg) { err.textContent = msg; err.classList.remove('hidden'); return; }

    let lead = id ? d.leads.find(x => x.id === id) : null;
    if (lead) {
      Object.assign(lead, { firstName: first, lastName: last, phone, email, notes });
    } else {
      lead = { id: uid(), firstName: first, lastName: last, phone, email, notes, createdAt: new Date().toISOString(), state: 'open' };
      d.leads.push(lead);
    }

    const wasBride = d.status === 'booked' && d.bookedLeadId === lead.id;
    if (status === 'won') {
      markBooked(activeKey, lead.id);
      toast(wasBride ? 'הפרטים עודכנו' : '💍 מזל טוב! התאריך נסגר');
    } else {
      if (wasBride) unbookDay(activeKey);
      lead.state = status;
      toast(status === 'cancelled' ? 'הפנייה סומנה כמבוטלת' : wasBride ? 'התאריך שוחרר' : id ? 'הפרטים עודכנו' : 'המתעניינת נוספה');
    }
    save(); hide('formModal'); renderDay(); renderCalendar();
  }

  // ---------- UI utils ----------
  function show(id) { $(id).classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
  function hide(id) {
    $(id).classList.add('hidden');
    if (['dayModal', 'formModal', 'confirmModal'].every(m => $(m).classList.contains('hidden'))) document.body.style.overflow = '';
  }

  let confirmCb = null;
  function confirmBox(html, yesText, yesClass, cb) {
    $('confirmText').innerHTML = html;
    const yes = $('confirmYes');
    yes.textContent = yesText;
    yes.className = `flex-1 py-3 rounded-2xl text-white font-semibold ${yesClass}`;
    confirmCb = cb;
    show('confirmModal');
  }

  let toastTimer = null;
  function toast(text) {
    $('toastInner').textContent = text;
    $('toast').classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.add('hidden'), 2200);
  }

  // ---------- Backup ----------
  function exportData() {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `bridal-calendar-${todayKey()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || typeof data.days !== 'object') throw new Error();
        confirmBox('הייבוא יחליף את כל הנתונים הקיימים. להמשיך?', 'ייבוא', 'bg-zinc-900', () => {
          db = data; save(); renderCalendar(); toast('הגיבוי יובא בהצלחה');
        });
      } catch { toast('קובץ גיבוי לא תקין'); }
    };
    reader.readAsText(file);
  }

  // ---------- Events ----------
  $('btnPrev').addEventListener('click', () => { if (--viewMonth < 0) { viewMonth = 11; viewYear--; } renderCalendar(); });
  $('btnNext').addEventListener('click', () => { if (++viewMonth > 11) { viewMonth = 0; viewYear++; } renderCalendar(); });
  $('btnToday').addEventListener('click', () => { const t = new Date(); viewYear = t.getFullYear(); viewMonth = t.getMonth(); renderCalendar(); });
  $('dayModalBody').addEventListener('click', handleDayAction);
  $('dayModalFooter').addEventListener('click', handleDayAction);
  $('leadForm').addEventListener('submit', submitForm);
  $('confirmYes').addEventListener('click', () => { hide('confirmModal'); const cb = confirmCb; confirmCb = null; cb && cb(); });
  $('confirmNo').addEventListener('click', () => { hide('confirmModal'); confirmCb = null; });
  document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => hide(el.dataset.close)));
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    for (const m of ['confirmModal', 'formModal', 'dayModal']) if (!$(m).classList.contains('hidden')) { hide(m); break; }
  });
  $('btnExport').addEventListener('click', exportData);
  $('fileImport').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) importData(f); e.target.value = ''; });

  // Swipe between months
  let touchX = null;
  const grid = $('calendarGrid');
  grid.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
  grid.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) < 60) return;
    // RTL: swipe right -> next month, swipe left -> previous month
    (dx > 0 ? $('btnNext') : $('btnPrev')).click();
  }, { passive: true });

  window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY) { db = load(); renderCalendar(); } });

  renderCalendar();
})();
</script>
</body>
</html>
